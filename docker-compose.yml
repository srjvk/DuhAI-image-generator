version: '3.8'

services:
  api-server:
    build: ./server
    container_name: duhai-backend
    ports:
      - "1234:1234"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
  
  client-app:
    build: ./frontend
    container_name: duhai-frontend
    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-server
  
    

    